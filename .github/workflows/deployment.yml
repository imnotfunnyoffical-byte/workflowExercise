name: Deployment
on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests files
        run: |
          echo "Running tests..."
          npm test
          echo "Tests completed."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
      - uses: actions/checkout@v7
      - name: Setup Node
      - uses: actions/setup-node@v7
      - with:
      - node-version: 20
      - name: Install dependencies
      - run: npm ci
      - name: Run Lint
        run: |
          echo "Running Lint..."
          npm run lint
          echo "Lint completed"

  deploy:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: |
          echo "Running tests..."
          npm run build
          echo "Tests completed."
    
